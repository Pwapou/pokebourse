<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      .bg { fill: #f0f2f5; }
      .browser-bar { fill: #ffffff; stroke: #e4e6eb; }
      .popup { fill: #ffffff; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.15)); rx: 12px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #171827; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #727785; }
      .card-item { fill: #ffffff; stroke: #e7e8ed; stroke-width: 1; rx: 8px; }
      .btn-primary { fill: #625df5; rx: 6px; }
      .btn-sec { fill: #f6f7fb; stroke: #d0d3de; stroke-width: 1; rx: 6px; }
      .badge-count { fill: #e8f6ef; }
    </style>
  </defs>

  <rect width="1000" height="650" class="bg" />

  <!-- Mock Web Browser Header -->
  <rect x="50" y="30" width="900" height="45" rx="8" class="browser-bar" />
  <circle cx="75" cy="52" r="5" fill="#ff5f56" />
  <circle cx="92" cy="52" r="5" fill="#ffbd2e" />
  <circle cx="109" cy="52" r="5" fill="#27c93f" />

  <!-- URL Bar -->
  <rect x="140" y="40" width="600" height="26" rx="13" fill="#f0f2f5" />
  <text x="160" y="57" font-family="-apple-system, sans-serif" font-size="12" fill="#65676b">🔒 https://www.vinted.fr/items/498210-dracaufeu-holo-edition-1</text>

  <!-- Browser Extension Icon in toolbar -->
  <rect x="760" y="38" width="30" height="30" rx="6" fill="#2b2a4b" />
  <text x="775" y="58" font-size="14" text-anchor="middle" fill="#ffffff">⚡</text>
  <!-- Badge on Icon -->
  <circle cx="788" cy="40" r="7" fill="#ef4444" />
  <text x="788" y="44" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Simulated Web Page Content Behind -->
  <rect x="80" y="100" width="460" height="480" rx="8" fill="#ffffff" stroke="#e4e6eb" />
  <rect x="100" y="120" width="420" height="200" rx="6" fill="#f7f8fa" />
  <text x="310" y="225" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🔥</text>
  <text x="100" y="350" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#171827">Carte Pokémon Dracaufeu Holo 4/102</text>
  <text x="100" y="375" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#097a56">120,00 €</text>
  <text x="100" y="400" font-family="-apple-system, sans-serif" font-size="12" fill="#727785">Vendeur : Collectionneur_Nord (4.9 ★ - 148 avis)</text>

  <!-- Notification Toast from extension on the page -->
  <rect x="100" y="440" width="380" height="42" rx="8" fill="#171827" />
  <text x="120" y="465" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#56c795">⚡ Pokébourse Capture :</text>
  <text x="260" y="465" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff">Annonce détectée et enregistrée !</text>

  <!-- POPUP CHROME (Open on the right) -->
  <rect x="580" y="75" width="370" height="540" class="popup" />

  <!-- Popup Header -->
  <rect x="580" y="75" width="370" height="55" rx="12" fill="#171827" />
  <rect x="595" y="87" width="28" height="28" rx="6" fill="#625df5" />
  <text x="609" y="106" font-size="14" fill="#ffffff" text-anchor="middle">⚡</text>
  <text x="632" y="100" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pokébourse Capture</text>
  <text x="632" y="115" font-family="-apple-system, sans-serif" font-size="10" fill="#8f91a3">Manifest V3 • Assistant Navigation</text>

  <!-- Auto Capture Toggle -->
  <rect x="880" y="92" width="50" height="20" rx="10" fill="#56c795" />
  <circle cx="918" cy="102" r="8" fill="#ffffff" />

  <!-- Popup Toolbar -->
  <rect x="580" y="130" width="370" height="35" fill="#f6f7fb" stroke="#e7e8ed" />
  <text x="600" y="152" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#171827">3 ANNONCES EN ATTENTE</text>
  <text x="910" y="152" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ef4444" text-anchor="end">Tout vider 🗑️</text>

  <!-- List Item 1 -->
  <rect x="595" y="180" width="340" height="70" class="card-item" />
  <rect x="605" y="190" width="50" height="50" rx="6" fill="#f0f2f5" />
  <text x="630" y="220" font-size="18" text-anchor="middle">🐉</text>
  <text x="665" y="206" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#171827">Dracaufeu Holo 4/102</text>
  <text x="665" y="222" font-family="-apple-system, sans-serif" font-size="11" fill="#727785">Vinted • Vendeur: Collectionneur_Nord</text>
  <text x="665" y="238" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#12805c">120,00 €</text>
  <text x="920" y="206" font-size="14" fill="#a0a3bd" text-anchor="middle">✕</text>

  <!-- List Item 2 -->
  <rect x="595" y="260" width="340" height="70" class="card-item" />
  <rect x="605" y="270" width="50" height="50" rx="6" fill="#f0f2f5" />
  <text x="630" y="300" font-size="18" text-anchor="middle">⚡</text>
  <text x="665" y="286" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#171827">Pikachu VMAX Rainbow</text>
  <text x="665" y="302" font-family="-apple-system, sans-serif" font-size="11" fill="#727785">Leboncoin • Vendeur: Julien_K</text>
  <text x="665" y="318" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#12805c">65,00 €</text>
  <text x="920" y="286" font-size="14" fill="#a0a3bd" text-anchor="middle">✕</text>

  <!-- List Item 3 -->
  <rect x="595" y="340" width="340" height="70" class="card-item" />
  <rect x="605" y="350" width="50" height="50" rx="6" fill="#f0f2f5" />
  <text x="630" y="380" font-size="18" text-anchor="middle">🦊</text>
  <text x="665" y="366" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#171827">Lot 50 Cartes Anciennes + Evoli</text>
  <text x="665" y="382" font-family="-apple-system, sans-serif" font-size="11" fill="#727785">Vinted • Vendeur: Thomas_75</text>
  <text x="665" y="398" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#12805c">35,00 €</text>
  <text x="920" y="366" font-size="14" fill="#a0a3bd" text-anchor="middle">✕</text>

  <!-- Transfer Actions -->
  <!-- Action 1: Direct Send to Local PokeBourse -->
  <rect x="595" y="430" width="340" height="42" class="btn-primary" />
  <text x="765" y="456" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🚀 Envoyer à Pokébourse locale (3)</text>

  <!-- Action 2: Download JSONL -->
  <rect x="595" y="482" width="165" height="34" class="btn-sec" />
  <text x="677" y="504" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#20242d" text-anchor="middle">⬇️ Télécharger .jsonl</text>

  <!-- Action 3: Copy JSONL -->
  <rect x="770" y="482" width="165" height="34" class="btn-sec" />
  <text x="852" y="504" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#20242d" text-anchor="middle">📋 Copier JSONL</text>

  <!-- Footer Info -->
  <rect x="595" y="530" width="340" height="60" rx="6" fill="#f6f7fb" />
  <text x="610" y="550" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#625df5">POURQUOI L'EXTENSION ?</text>
  <text x="610" y="565" font-family="-apple-system, sans-serif" font-size="9" fill="#727785">Contourne les protections anti-bot (Cloudflare, DataDome) en</text>
  <text x="610" y="578" font-family="-apple-system, sans-serif" font-size="9" fill="#727785">agissant comme assistant lors de votre navigation réelle 100% légitime.</text>
</svg>