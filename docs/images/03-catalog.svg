      .text-sidebar-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .pill-active { fill: #20242d; rx: 14px; }
      .pill-active-txt { font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
