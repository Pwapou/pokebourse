  <text x="310" y="562" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#20242d">💡 Architecture éthique &amp; Résilience face aux anti-bots :</text>
  <text x="310" y="583" font-family="-apple-system, sans-serif" font-size="11" fill="#727785">• Aucun compte marketplace requis, aucun contournement de CAPTCHA / DataDome / Cloudflare.</text>
  <text x="310" y="602" font-family="-apple-system, sans-serif" font-size="11" fill="#727785">• Concurrence bornée à 1 exécution par plateforme avec backoff exponentiel et jitter aléatoire.</text>
