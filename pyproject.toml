[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-arbitrage"
version = "0.1.0"
description = "Aide à la décision pour l'achat-revente de cartes Pokémon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crawlee[playwright]>=1,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "lbc>=1.1,<2",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
  "vinted_scraper>=5,<6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
pokemon-arbitrage = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["static/*.css", "static/*.js", "templates/*.html"]
"app.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
